# ---- Market-regime rules (phase 2). Result: TRENDING_UP / TRENDING_DOWN / RANGE /
# VOLATILE / EVENT, or UNKNOWN when any input is missing or stale. ----
regime:
  index_symbol: NIFTY
  vix_symbol: INDIAVIX
  sma_fast_days: 20              # trend needs NIFTY above/below both averages
  sma_slow_days: 50
  atr_days: 14
  volatile_range_atr_mult: 1.5   # VOLATILE if today's NIFTY high-low range > 1.5 x ATR
  vix_lookback_days: 252         # about one year of trading days
  vix_percentile: 80             # VOLATILE if VIX is above this percentile of the lookback
  vix_min_history_days: 200      # fewer VIX days than this => UNKNOWN
  breadth_sma_days: 20           # breadth = % of watchlist stocks above their 20-day average
  breadth_up_pct: 60             # TRENDING_UP needs breadth >= this
  breadth_down_pct: 40           # TRENDING_DOWN needs breadth <= this
  breadth_min_coverage_pct: 80   # share of watchlist stocks with usable data, else UNKNOWN
  event_types: [EXPIRY, RBI_POLICY, BUDGET, MARKET_EVENT]   # market-wide events that force EVENT
  recompute_seconds: 60
  ignore_5m_bar_starts: ["15:15", "15:20"]   # unreliable Breeze history bars; ignored by the backtest regime, kept in storage

bias:
  streak_days: 3                 # BEARISH after 3 straight days of FII net selling, BULLISH after 3 of buying

history:
  daily_days: 4400               # daily bars to download (calendar days, ~12 years); Breeze's own limit applies (a floor is recorded); the regime needs ~250 sessions of VIX before each backtest day
  intraday_days: 190             # 5-minute bars to download (calendar days); 6+ months for phase 3 backtests
  sim_seed_on_start: true        # sim mode only: generate fake history so the badge works
  request_pause_seconds: 0.7     # breeze: pause between history requests (Breeze allows ~100/minute)
  empty_retries: 2               # breeze: ask again this many times when a reply is empty
  retry_pause_seconds: 3.0       # breeze: wait before each retry
  request_timeout_seconds: 60    # breeze: give up on a request with no reply (that symbol is reported failed; rerun to resume)
  max_overnight_gap_pct: 25      # stocks: a bigger overnight jump (unadjusted split/bonus/demerger) breaks the history

calendar:                        # CSV files you maintain (see README)
  events_csv: data/events.csv
  holidays_csv: data/holidays.csv
  fii_dii_csv: data/fii_dii.csv
  # rows imported from the external repo (personal use only, no redistribution) live in data/external/
  # events_external.csv and fii_dii_external.csv (gitignored), merged on load; your own files win on the same date

external_data:                   # one-time import (python -m app.external_data); data files only, no script is run
  repo_path: ../external_data/indian-market-historical-data
  history_since: 2019-01-22
  corporate_actions_since: 2019-01-01
  positioning_since: 2024-01-01
  crosscheck_mismatch_pct: 0.5   # daily close vs Breeze: stored and reported above this

data_quality:                    # PRE-REGISTERED 2026-11-15 (docs/STATUS.md): stock-years excluded from Phase 9 backtests
  max_unexplained_pct: 5         # unexplained Breeze-vs-repo close mismatches above this share of the year's sessions
  max_one_day_jump_pct: 20       # or any one-day Breeze close move above this with no split, bonus or demerger
  resolved_stock_years: []       # "SYMBOL:YEAR" only once a resolution is recorded in docs/STATUS.md

data_status:                     # the Data status page (/data-status): when a source counts as STALE
  fii_dii_max_trading_days: 1
  coverage_max_age_days: 7
  corporate_actions_max_age_days: 7
  rbi_decision_grace_days: 3     # a scheduled RBI meeting with no decision row this many days later: amber
  inbox_dir: data/inbox          # files you download by hand; processed -> done/, rejected -> rejected/
  board_meetings_min_symbols: 100   # an all-companies board-meetings export lists at least this many companies
  board_meetings_edge_days: 7       # ... and has meetings within this many days of both ends of the declared range

server:
  host: 127.0.0.1              # local only; do not change to 0.0.0.0
  port: 8000

storage:                       # one file per feed mode; chosen from feed.mode
  db_path_sim: data/market_sim.db     # feed.mode: sim
  db_path_live: data/market_live.db   # feed.mode: breeze (never receives sim rows)

# ---- Phase 3: trading costs (ICICI Direct) ----
# STANDARD RATES, NOT YET VERIFIED AGAINST A CONTRACT NOTE. Every backtest report shows `label`.
# Compare one real contract note line by line, then set verified_against_contract_note: true.
# A rate with value: null has not been sourced; any backtest that needs it stops and names it.
# Percentages are % of turnover (equity) or of premium (options).
costs:
  label: "standard rates, not yet verified against a contract note"
  verified_against_contract_note: false
  plan: "ICICI Direct Prime 4999 (user, 2026-11-13)"
  compiled_on: "2026-11-13"
  gst_pct: {value: 18, source: "zerodha.com/charges; angelone.in/exchange-transaction-charges; icicidirect.com (GST 18% on brokerage)", effective: "in force on 2026-11-12 (start date not stated on source)"}
  # Zerodha and Angel One differ on whether GST applies to the tiny IPFT charge; both include brokerage, NSE and SEBI.
  gst_on: [brokerage, exchange_txn, sebi_fee, ipft, dp_charge]
  intraday_equity:
    brokerage_pct:      {value: 0.010, source: "ICICI Direct Prime 4999 plan rates as given by the user on 2026-11-13; charged on both sides (user): intraday 0.010%", effective: "user's current plan (2026-11-13)"}
    stt_buy_pct:        {value: 0, source: "zerodha.com/charges; angelone.in; navia.co.in STT table (sell side only)", effective: "2026-04-01 (Finance Act 2026, per navia.co.in)"}
    stt_sell_pct:       {value: 0.025, source: "zerodha.com/charges; angelone.in; navia.co.in (dated 2026-11-11)", effective: "2026-04-01 (Finance Act 2026, per navia.co.in; cash rates unchanged)"}
    exchange_txn_pct:   {value: 0.00307, source: "NSE circular NSE/FA/73061 dated 2026-02-27 (as given by the user; not fetched here): equity cash total NSE outflow Rs 307 per crore each side, including IPFT (matches zerodha.com/charges 0.00307%)", effective: "2026-03-01"}
    sebi_fee_pct:       {value: 0.0001, source: "zerodha.com/charges and angelone.in: Rs 10 per crore", effective: "in force on 2026-11-12 (start date not stated)"}
    stamp_duty_buy_pct: {value: 0.003, source: "zerodha.com/charges '0.003% or Rs 300/crore on buy side'; angelone.in 0.003%", effective: "in force on 2026-11-12 (start date not stated)"}
    ipft_pct:           {value: 0, source: "NSE circular NSE/FA/73061 dated 2026-02-27 (as given by the user; not fetched here): IPFT is included in the Rs 307/crore exchange charge above (0 here so it is not counted twice)", effective: "2026-03-01"}
  delivery_equity:
    brokerage_pct:      {value: 0.10, source: "ICICI Direct Prime 4999 plan rates as given by the user on 2026-11-13; charged on both sides (user): delivery 0.10%", effective: "user's current plan (2026-11-13)"}
    stt_buy_pct:        {value: 0.1, source: "zerodha.com/charges; angelone.in; navia.co.in", effective: "2026-04-01 (Finance Act 2026, per navia.co.in; unchanged)"}
    stt_sell_pct:       {value: 0.1, source: "zerodha.com/charges; angelone.in; navia.co.in", effective: "2026-04-01 (Finance Act 2026, per navia.co.in; unchanged)"}
    exchange_txn_pct:   {value: 0.00307, source: "NSE circular NSE/FA/73061 dated 2026-02-27 (as given by the user; not fetched here): equity cash total NSE outflow Rs 307 per crore each side, including IPFT (matches zerodha.com/charges 0.00307%)", effective: "2026-03-01"}
    sebi_fee_pct:       {value: 0.0001, source: "zerodha.com/charges and angelone.in: Rs 10 per crore", effective: "in force on 2026-11-12 (start date not stated)"}
    stamp_duty_buy_pct: {value: 0.015, source: "zerodha.com/charges '0.015% or Rs 1500/crore on buy side'; angelone.in 0.015%", effective: "in force on 2026-11-12 (start date not stated)"}
    ipft_pct:           {value: 0, source: "NSE circular NSE/FA/73061 dated 2026-02-27 (as given by the user; not fetched here): IPFT is included in the Rs 307/crore exchange charge above (0 here so it is not counted twice)", effective: "2026-03-01"}
    dp_charge_per_sell_inr: {value: 20, source: "icicidirect.com/brokerage: NSDL/CDSL Rs 20 + GST per scrip on the first debit of the day", effective: "in force on 2026-11-12 (no date on ICICI page)"}
  options:
    brokerage_per_lot_inr:    {value: 19, source: "ICICI Direct Prime 4999 plan rates as given by the user on 2026-11-13; charged on both sides (user): options Rs 19 per lot", effective: "user's current plan (2026-11-13)"}
    stt_sell_premium_pct:     {value: 0.15, source: "zerodha.com/charges; angelone.in; navia.co.in (0.10% -> 0.15%)", effective: "2026-04-01 (Finance Act 2026, per navia.co.in)"}
    exchange_txn_premium_pct: {value: 0.03553, source: "NSE circular NSE/FA/73061 dated 2026-02-27 (as given by the user; not fetched here): equity options total NSE outflow Rs 3,553 per crore of premium each side, including IPFT", effective: "2026-03-01"}
    sebi_fee_pct:             {value: 0.0001, source: "zerodha.com/charges and angelone.in: Rs 10 per crore", effective: "in force on 2026-11-12 (start date not stated)"}
    stamp_duty_buy_pct:       {value: 0.003, source: "zerodha.com/charges; angelone.in: 0.003% on buy side", effective: "in force on 2026-11-12 (start date not stated)"}
    # Transaction charge + IPFT = 0.03553% of premium (circular total); IPFT is inside that figure.
    ipft_pct:                 {value: 0, source: "NSE circular NSE/FA/73061 dated 2026-02-27 (as given by the user; not fetched here): IPFT is included in the Rs 3,553/crore exchange charge above (0 here so it is not counted twice)", effective: "2026-03-01"}
  slippage_pct:                # a setting, not a published rate: adverse move per side, % of price
    intraday_equity: 0.05
    delivery_equity: 0.05
    options: 0.5

# ---- Phase 3: strategy thresholds (each strategy has an id and version in its own file) ----
strategies:
  inactive: [vwap_pullback]     # retired from cash trading (phase 3b); code kept, run only by name
  # Alerts (phase 6) and mode per strategy, labelled from the backtest evidence (2026-11-13, Prime 4999 rates):
  # every phase 3 cash strategy loses after costs on the development period -> no alerts, paper only.
  status:
    orb: {alerts: false, mode: paper_only, label: "negative in backtests"}
    vwap_pullback: {alerts: false, mode: paper_only, label: "negative in backtests"}
    range_reversion: {alerts: false, mode: paper_only, label: "negative in backtests"}
    swing_pullback: {alerts: false, mode: paper_only, label: "negative in backtests"}
    swing_breakout: {alerts: false, mode: paper_only, label: "negative in backtests"}
    orb_v2: {alerts: false, mode: paper_only, label: "negative in backtests"}
    range_reversion_v2: {alerts: false, mode: paper_only, label: "negative in backtests"}
    swing_pullback_v2: {alerts: false, mode: paper_only, label: "negative in backtests"}
    swing_breakout_v2: {alerts: false, mode: paper_only, label: "negative in backtests"}
    # Phase 4 option strategies: no alerts; labels follow the option backtests (see docs/STATUS.md)
    long_option: {alerts: false, mode: paper_only, label: "no edge vs baseline"}
    credit_spread: {alerts: false, mode: paper_only, label: "no edge vs baseline (6 backtest trades: low sample)"}
    iron_condor: {alerts: false, mode: paper_only, label: "UNPROVEN: 1 backtest trade, no track record"}
    # Phase 9 (core only so far): no alerts until the cards and paper tracking exist (after phase 6)
    stock_option_selling: {alerts: false, mode: paper_only, label: "UNPROVEN: no track record yet"}
    # Reversal candidates: watch only. Nothing alerts until you approve it (also stock_option_selling.reversal.alerts_approved)
    reversal_put_spread: {alerts: false, mode: paper_only, label: "WATCH ONLY: awaiting your approval"}
    reversal_bull_call_spread: {alerts: false, mode: paper_only, label: "WATCH ONLY: awaiting your approval"}
  orb:                          # opening-range breakout, intraday
    range_minutes: 15           # opening range = 09:15-09:30
    breakout_buffer_pct: 0.05   # close must clear the range by this %
    max_range_pct: 1.5          # skip the day if the range is wider than this % of price
    min_volume_mult: 1.2        # breakout bar volume >= this x average opening-range bar volume (stocks)
    reward_risk: 2.0
    last_signal_time: "11:30"
  vwap_pullback:                # intraday, with the trend
    touch_pct: 0.15
    min_bars_on_side: 6
    stop_buffer_pct: 0.10
    reward_risk: 1.5
    first_signal_time: "09:45"
    last_signal_time: "14:30"
  range_reversion:              # intraday, RANGE days only
    band_bars: 20
    band_sd: 2.0
    stop_buffer_pct: 0.10
    min_reward_risk: 1.0
    first_signal_time: "09:45"
    last_signal_time: "14:30"
  swing_pullback:               # daily bars, long only (delivery)
    fast_sma: 20
    slow_sma: 50
    pullback_pct: 1.0
    atr_days: 14
    stop_atr_mult: 1.5
    reward_risk: 2.0
    max_hold_days: 10
  swing_breakout:               # daily bars, long only (delivery)
    lookback_days: 20
    volume_mult: 1.5
    atr_days: 14
    stop_atr_mult: 1.5
    reward_risk: 2.0
    max_hold_days: 10
  # ---- Phase 3b versions (v1 above kept unchanged for comparison) ----
  orb_v2:
    range_minutes: 30           # opening range 09:15-09:45
    min_volume_mult: 1.5        # breakout bar volume > this x the same time-of-day bar's average ...
    volume_lookback_sessions: 20  # ... over the previous 20 sessions
    min_volume_sessions: 15     # at least this many of them must have that bar
    reward_risk: 2.0
    last_signal_time: "11:30"
    min_stop_cost_mult: 5       # skip if stop distance < 5x estimated round-trip cost (charges + slippage)
  range_reversion_v2:
    band_bars: 20
    band_sd: 2.0
    stop_buffer_pct: 0.10
    first_signal_time: "09:45"
    last_signal_time: "14:30"
    min_stop_cost_mult: 5       # stop = further of the 3-bar extreme and 5x round-trip cost
    min_target_cost_mult: 2     # skip if the band average is closer than 2x round-trip cost
  swing_pullback_v2:
    fast_sma: 20
    slow_sma: 50
    pullback_pct: 1.0
    atr_days: 14
    stop_atr_mult: 1.5
    reward_risk: 2.0
    max_hold_days: 10
    index_sma_days: 50          # longs only while NIFTY closes above its 50-day average
  swing_breakout_v2:
    lookback_days: 20
    volume_mult: 1.5
    atr_days: 14
    stop_atr_mult: 1.5
    reward_risk: 2.0
    max_hold_days: 10
    index_sma_days: 50
  # ---- Phase 4: option strategies (index selling is hedged spreads only; stock options are buy-only) ----
  long_option:                  # buy a near-the-money call/put when an underlying strategy signals
    trigger_strategies: [swing_pullback_v2, orb_v2]
    max_iv_rank: 60             # buy only when IV rank is low or moderate
    min_days_to_expiry: 7
    stop_pct_of_premium: 40
    target_pct_of_premium: 80
    max_hold_days: 10
    stock_exit_days_before_expiry: 7   # stock options settle physically: out before expiry week
    index_exit_days_before_expiry: 0
  credit_spread:                # NIFTY / BANKNIFTY monthly: bull put (TRENDING_UP) or bear call (TRENDING_DOWN)
    min_iv_rank: 50             # sell only when IV rank is high
    max_short_delta: 0.20
    hedge_width_pct: 1.0        # bought strike about 1% of spot further out
    entry_min_dte: 20
    entry_max_dte: 35
    min_credit_pct_of_width: 8
    profit_target_pct_of_credit: 50
    stop_multiple_of_credit: 2.0   # close when buying the spread back costs 2x the credit
    exit_days_before_expiry: 1
  iron_condor:                  # NIFTY weekly, RANGE regime only
    min_iv_rank: 50
    max_short_delta: 0.15
    hedge_width_pct: 0.5
    entry_min_dte: 3
    entry_max_dte: 7
    min_credit_pct_of_width: 8
    profit_target_pct_of_credit: 50
    stop_multiple_of_credit: 2.0
    exit_days_before_expiry: 0  # out at the open of expiry day at the latest

# ---- Phase 4: options. Lot sizes and expiry dates are read from ICICI's instrument list, never from here. ----
options:
  risk_free_rate_pct: 6.5       # ASSUMPTION for Black-Scholes IV and delta (roughly the 91-day T-bill yield); not verified
  iv_reference_symbol: INDIAVIX # index IV rank uses India VIX; stock IV rank uses stored ATM implied volatility
  iv_rank_lookback_days: 252
  iv_rank_min_history_days: 200
  underlyings:
    NIFTY:     {expiries: [weekly, monthly], backtest_strike_step: 100, dividend_yield_pct: 0}
    BANKNIFTY: {expiries: [monthly], backtest_strike_step: 500, dividend_yield_pct: 0}
  stocks: {expiries: [monthly], dividend_yield_pct: 0}   # every watchlist stock; buy-only in this phase
  chain:
    refresh_seconds: 300        # breeze mode: index chains are reloaded this often during market hours
    max_age_seconds: 900        # an older chain is stale: no option signal
    max_spread_pct: 10          # traded strikes need a bid-ask width within 10% of the mid price
    min_open_interest_lots: 100
    request_pause_seconds: 0.7
  margin:
    csv: data/margins.csv       # margins you copy from ICICI's margin calculator (see README)
    max_age_days: 7
  backtest:
    underlyings:
      credit_spread: [NIFTY, BANKNIFTY]
      iron_condor: [NIFTY]
      long_option: [NIFTY, BANKNIFTY]   # stocks: add e.g. RELIANCE, HDFCBANK and run with --download (their option history is only partly stored)
    start:
      iron_condor: 2024-01-01   # weekly option history is downloaded from here (extend if wanted)
    trigger: swing_pullback_v2  # long_option backtests use this daily trigger (intraday triggers are not backtested)
    max_requests_per_run: 1500
    daily_request_budget: 3500  # option-history requests to Breeze per day (IST), counted across runs; downloads resume the next day
    strike_search_steps: 8

# ---- Phase 9: stock option selling (monthly hedged credit spreads on F&O stocks). Core rules and backtest; ----
# ---- signal cards, alerts and manual positions come after phase 6. ----
stock_option_selling:          # names follow section 2 of the Phase 9 specification (docs/implementation.md has the table)
  enabled: true
  min_iv_rank: 50               # sell only when the stock's IV rank is at least this
  min_open_interest_lots: 200   # each traded strike: open interest, in lots, at least this
  max_bid_ask_pct_of_mid: 5     # each traded strike (live eligibility): bid-ask width within 5% of the mid price
  short_delta_max: 0.20
  hedge_strikes_out: [2, 3]     # bought strike 2 strikes further out; 3 if 2 does not qualify
  max_risk_per_position_pct: 2.5   # a position's cost-inclusive max loss, % of capital; whole lots, rounded down
  min_credit_to_max_loss: 0.10  # set by you on 2026-11-14 from the pre-outcome distribution (not from results)
  entry_dte_min: 20             # calendar days to expiry
  entry_dte_max: 35
  profit_target_pct_of_credit: 50
  stop_spread_value_multiple: 2.0   # exit when buying the spread back costs 2x the entry credit
  time_exit_dte: 10             # out at the open of the first session within 10 calendar days of expiry
  forced_exit_trading_days_before_expiry: 5   # no position inside the last 5 trading days, whatever else
  event_coverage_max_age_days: 7   # EVENT_COVERAGE_UNKNOWN unless events.csv has a COVERAGE row for the stock, retrieved within 7 days, covering expiry
  sma_short: 20                 # swing trend rule: close above sma_mid and sma_short above sma_mid = up trend
  sma_mid: 50                   # also the breadth average of the market block
  sma_long: 200                 # falling-stock block, market block (NIFTY), washed-out list
  atr_days: 14
  swing_pivot_bars: 5           # a pivot needs 5 sessions on each side and is usable only after the 5 later ones completed
  pivot_lookback_sessions: 252  # support = nearest confirmed pivot low below the close, resistance = nearest pivot high above it
  shortlist_size: 10
  score:                        # 0-100 candidate score (spec section 4): a ranking aid, never a probability
    weights: {iv_rank: 1, iv_falling: 1, rel_strength: 1, strike_distance: 1, range_profile: 1, liquidity: 1}   # equal
    iv_peak_sessions: 20        # iv_falling: IV at or below 90% of its 20-session peak gets full points
    iv_falling_ratio: 0.9
    hist_fall_sessions: 21      # hist_fall_percentile: the 90th percentile of 21-session falls since 2019-01-22
    hist_fall_percentile: 90
  trend_block:                  # DOWNTREND_BLOCK: no put selling in a falling stock (mirrored for calls in a strong uptrend)
    enabled: true
    new_low_lookback: 20        # a 52-week low (lowest close of low_52w_sessions) made within the last 20 sessions blocks
    low_52w_sessions: 252
    rel_strength_lookback: 63   # 3-month return against NIFTY
    rel_strength_max_lag_pct: 5 # blocked when it trails (puts) / leads (calls) NIFTY by more than 5 points
  market_block:                 # MARKET_WEAK: no put selling when NIFTY is below its sma_long or breadth is thin
    enabled: true
    market_breadth_min_pct: 40  # share of the Nifty 50 watchlist stocks closing above their sma_mid
    min_coverage_pct: 80        # fewer stocks with usable data than this: breadth unknown (MARKET_UNKNOWN), which blocks too
  portfolio:                    # CORRELATED_LIMIT, CORRELATION_UNKNOWN, PORTFOLIO_UNKNOWN (every position counts on its own)
    enabled: true
    max_open_spreads: 6
    max_total_risk_pct: 10      # of capital, all open positions together
    correlation_window: 60      # sessions of daily returns, completed sessions only
    correlation_threshold: 0.7  # linked when correlation >= 0.7, or same sector
    correlation_min_overlap: 50 # common return observations needed, else CORRELATION_UNKNOWN
    group_max_positions: 2      # per connected group of linked stocks, the proposed position included
    group_max_risk_pct: 5       # of capital, per group
  campaign_limit:               # STOCK_LOSS_LIMIT: per stock, closed manual positions included once recorded
    enabled: true
    stock_loss_window_days: 90
    stock_loss_max_stops: 2     # this many stopped trades in the window ...
    stock_loss_max_pct_capital: 1.5   # ... or a net loss of 1.5% of capital in the window
    stock_cooloff_days: 30      # no new signal in that stock for 30 calendar days
  roll:                         # a roll is suggested only if every rule holds (spec section 6); otherwise the alert is "exit"
    max_rolls: 1                # rolls allowed in one campaign (the original trade and its rolls)
    min_roll_net_credit_pct_of_width: 10   # (new credit - debit to close the old spread - all roll charges) above 10% of the replacement width
    stuck_time_value_pct: 20    # stuck: sold option in the money with time value under 20% of its price, or inside the forced-exit window
  reversal:                     # reversal detector for washed-out stocks: a watch list and candidates, never a signal
    enabled: true
    alerts_approved: false      # no reversal alert is produced until you set this to true
    washed_out_drawdown_pct: 25 # 25% or more below the 52-week high ...
    min_sessions_below_long: 63 # ... with at least 63 sessions in a row below the 200-day average
    high_lookback_sessions: 252
    base_no_new_low_sessions: 15     # base forming: no new low for 15 sessions ...
    range_sessions: 10               # ... and the 10-session ATR
    range_compare_sessions: 20       # below 0.8 x the 20-session ATR (base_range_contraction)
    range_shrink_ratio: 0.8
    base_valid_sessions: 10          # the confirmation must come within 10 sessions of a base-forming day
    confirm_sma_days: 20             # confirmed: close above the 20-day average and above the last swing high,
    volume_sma_days: 20              # volume above its 20-day average,
    relative_return_sessions: 10     # and the 10-session return ahead of NIFTY
    lift_sessions: 20                # the falling-stock block is lifted for 20 sessions, only for put spreads below the base low
    rearm_sessions: 40               # one confirmation per stock in 40 sessions
    outcome_sessions: [10, 20, 40]
    bull_call:                       # candidate 1: buy the call nearest the money, sell the call 2 strikes higher
      width_strikes: 2
      entry_min_dte: 20
      entry_max_dte: 35              # same 20-35 day window as the put spread
      target_pct_of_max_profit: 60   #
      stop_pct_of_debit: 50          #
      exit_days_before_expiry: 7
  profile:                      # range and speed profile, scenario history, alert levels (data from 2019-01-22 only)
    windows_years: [2, 5]
    state_lookback_sessions: 20
    trending_efficiency: 0.30   # net move / distance travelled over the lookback; below = ranging
    holding_sessions: 20        # breach history: a strike this far away, held this many sessions
    scenario_horizon_days: 30
    scenario_min_cases: 10      # fewer past cases are marked LOW SAMPLE
    vix_spike_rise_pct: 20      # vix_spike: India VIX up 20% over 5 sessions ...
    vix_spike_sessions: 5
    vix_spike_percentile: 80    # ... or closing above its 80th percentile of the previous 252 sessions
    vix_percentile_lookback: 252
  backtest:
    priority_stocks: 30         # the 30 most liquid watchlist F&O stocks (median daily traded value) are downloaded and tested
    liquidity_lookback_days: 60
    exit_checks: [intraday, daily]   # first = main result. intraday = synchronized 5-minute bars of every leg; daily = daily closes
    exit_on_strike_breach: true      # close at the next open when the stock closes beyond the sold strike
    capital_inr: 1000000             # capital the Phase 9 backtests run at (your stock-option capital); limits stay a % of it
    download_first_years_from: 2023  # complete 2023-2026 for every priority stock (newest first) before any earlier year
    exit_policies: [stop, roll_rules, roll_always]   # compared on the same entries: stop at 2x credit / roll by the rules / roll every month

# ---- Phase 3: backtest and walk-forward ----
backtest:
  intraday_exit_time: "15:15"   # open intraday trades are closed at the close of the bar ending 15:15 IST
  last_entry_time: "14:45"
  position_cap_pct: 25          # position value <= 25% of capital (sizing: risk.max_loss_per_trade_pct)
  holdout_pct: 20               # last 20% of sessions untouched unless you run with --holdout
  window_sessions: 21           # walk-forward test windows of ~1 month
  step_sessions: 21
  min_trades: 30                # fewer trades => LOW SAMPLE
  reports_dir: data/backtests
  holdout_start:                # fixed holdout (phase 3b): sessions on/after these dates are never used in development
    5minute: 2026-10-05
    1day: 2026-06-08
  test_start:                   # first session tested (older bars still feed averages); see STATUS phase 3b
    1day: 2019-01-22            # Breeze daily history before this has wrong-scale days (stocks) and x100 VIX values
